name: Deploy Dev para Hostinger VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executando deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            if [ ! -d /var/www/erp-dev ]; then
              git clone -b dev https://github.com/Sr-Ryuk/erp-lambadega /var/www/erp-dev
            fi

            cd /var/www/erp-dev

            git fetch origin
            git checkout dev
            git pull origin dev

            cat > backend/.env.dev <<ENV
            APP_ENV=local
            APP_DEBUG=true
            APP_KEY=${{ secrets.DEV_APP_KEY }}
            APP_URL=${{ secrets.DEV_APP_URL }}

            DB_CONNECTION=mysql
            DB_HOST=db_dev
            DB_PORT=3306
            DB_DATABASE=erp_db_dev
            DB_USERNAME=erp_user
            DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            ENV

            export DEV_DB_ROOT_PASSWORD=${{ secrets.DEV_DB_ROOT_PASSWORD }}
            export DEV_DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}

            docker compose -f docker-compose.dev.yml up -d --build

            docker exec backend_dev php artisan migrate --force
            docker exec backend_dev php artisan config:cache
            docker exec backend_dev php artisan route:cache
            docker exec backend_dev php artisan view:cache

            docker compose -f /var/www/erp/docker-compose.prod.yml exec -T webserver nginx -s reload

            for i in $(seq 1 12); do
              curl -sf "https://api-dev.inovabi.com/up" && break
              echo "Aguardando backend_dev... tentativa $i/12"
              sleep 5
            done
            curl -sf "https://api-dev.inovabi.com/up" || (echo "Health check falhou" && exit 1)

            echo "Deploy de dev concluído com sucesso."
