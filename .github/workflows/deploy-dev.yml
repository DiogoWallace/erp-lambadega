name: Deploy Dev para Hostinger VPS

on:
  push:
    branches:
      - dev

jobs:
  testes:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Executando deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          request_pty: true
          command_timeout: 20m
          script: |
            set -e

            if [ ! -d /var/www/erp-dev ]; then
              git clone -b dev https://github.com/Sr-Ryuk/erp-lambadega /var/www/erp-dev
            fi

            cd /var/www/erp-dev

            git fetch origin
            git checkout dev
            git pull origin dev

            printf 'APP_ENV=local\n' > backend/.env.dev
            printf 'APP_DEBUG=true\n' >> backend/.env.dev
            printf 'APP_KEY=%s\n' '${{ secrets.DEV_APP_KEY }}' >> backend/.env.dev
            printf 'APP_URL=%s\n' '${{ secrets.DEV_APP_URL }}' >> backend/.env.dev
            printf 'DB_CONNECTION=mysql\n' >> backend/.env.dev
            printf 'DB_HOST=db_dev\n' >> backend/.env.dev
            printf 'DB_PORT=3306\n' >> backend/.env.dev
            printf 'DB_DATABASE=erp_db_dev\n' >> backend/.env.dev
            printf 'DB_USERNAME=erp_user\n' >> backend/.env.dev
            printf 'DB_PASSWORD=%s\n' '${{ secrets.DEV_DB_PASSWORD }}' >> backend/.env.dev
            printf 'SANCTUM_STATEFUL_DOMAINS=dev.inovabi.com\n' >> backend/.env.dev
            printf 'SANCTUM_TOKEN_EXPIRATION=1440\n' >> backend/.env.dev
            printf 'CORS_ALLOWED_ORIGINS=https://dev.inovabi.com\n' >> backend/.env.dev

            export DEV_DB_ROOT_PASSWORD=${{ secrets.DEV_DB_ROOT_PASSWORD }}
            export DEV_DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}

            docker compose -f docker-compose.dev.yml up -d --build --remove-orphans

            docker exec backend_dev php artisan migrate --force
            docker exec backend_dev php artisan db:seed --class=RoleSeeder --force
            docker exec backend_dev php artisan config:cache
            docker exec backend_dev php artisan route:cache
            docker exec backend_dev php artisan view:cache

            docker compose -f /var/www/erp/docker-compose.prod.yml exec -T webserver nginx -s reload

            echo "Verificando saúde do backend_dev..."
            for i in $(seq 1 12); do
              if docker exec backend_dev php artisan about --only=environment > /dev/null 2>&1; then
                echo "Backend dev está saudável."
                break
              fi
              echo "Aguardando backend_dev... tentativa $i/12"
              sleep 5
              if [ "$i" -eq 12 ]; then
                echo "Health check falhou"
                exit 1
              fi
            done

            echo "Deploy de dev concluído com sucesso."
