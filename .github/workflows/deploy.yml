name: Deploy Produção

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_APP_KEY: ${{ secrets.PROD_APP_KEY }}
          PROD_DB_ROOT_PASSWORD: ${{ secrets.PROD_DB_ROOT_PASSWORD }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          PROD_NEXT_PUBLIC_API_URL: ${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PROD_APP_KEY,PROD_DB_ROOT_PASSWORD,PROD_DB_PASSWORD,PROD_APP_URL,PROD_NEXT_PUBLIC_API_URL
          script: |
            set -e
            cd /var/www/erp

            git pull origin main

            # Gera o .env raiz para o docker compose (credenciais do MySQL)
            cat > .env << EOF
            DB_ROOT_PASSWORD=${PROD_DB_ROOT_PASSWORD}
            DB_PASSWORD=${PROD_DB_PASSWORD}
            EOF

            # Gera o .env do backend (Laravel)
            cat > backend/.env << EOF
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=${PROD_APP_KEY}
            APP_DEBUG=false
            APP_URL=${PROD_APP_URL}

            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=erp_db
            DB_USERNAME=erp_user
            DB_PASSWORD=${PROD_DB_PASSWORD}

            SESSION_DRIVER=database
            SESSION_LIFETIME=120
            SESSION_ENCRYPT=false
            SESSION_PATH=/
            SESSION_DOMAIN=null

            BROADCAST_CONNECTION=log
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database
            CACHE_STORE=database

            LOG_CHANNEL=stack
            LOG_LEVEL=error
            EOF

            # Gera o .env do frontend (Next.js)
            cat > frontend/.env.local << EOF
            NEXT_PUBLIC_API_URL=${PROD_NEXT_PUBLIC_API_URL}
            EOF

            # Sobe os containers
            docker compose -f docker-compose.prod.yml up -d --build

            # Pós-deploy Laravel
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:cache

            # Health check
            sleep 15
            curl -sf "${PROD_APP_URL}/up" || (echo "Health check falhou" && exit 1)

            echo "Deploy de produção concluído com sucesso."
