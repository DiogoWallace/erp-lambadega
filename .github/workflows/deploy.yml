name: Deploy para Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executando deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          request_pty: true
          command_timeout: 20m
          script: |
            set -e

            cd /var/www/erp

            git pull origin main

            cat > .env <<ENV
            PROD_DB_ROOT_PASSWORD=${{ secrets.PROD_DB_ROOT_PASSWORD }}
            PROD_DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            PROD_NEXT_PUBLIC_API_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
            ENV

            cat > backend/.env <<ENV
            APP_ENV=production
            APP_DEBUG=false
            APP_KEY=${{ secrets.PROD_APP_KEY }}
            APP_URL=${{ secrets.PROD_APP_URL }}

            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=erp_db
            DB_USERNAME=erp_user
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}

            SANCTUM_STATEFUL_DOMAINS=inovabi.com
            SANCTUM_TOKEN_EXPIRATION=1440
            CORS_ALLOWED_ORIGINS=https://inovabi.com
            ENV

            docker compose -f docker-compose.prod.yml up -d --build

            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate:fresh --seed --force
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:cache

            for i in $(seq 1 12); do
              curl -sf "https://api.inovabi.com/up" && break
              echo "Aguardando backend... tentativa $i/12"
              sleep 5
            done
            curl -sf "https://api.inovabi.com/up" || (echo "Health check falhou" && exit 1)

            echo "Deploy de produção concluído com sucesso."
