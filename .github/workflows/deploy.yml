name: Deploy para Hostinger VPS

on:
  push:
    branches:
      - main # O deploy roda automaticamente ao atualizar a main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executando deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/erp
            
            # 1. Puxa as novidades do GitHub
            git pull origin main
            
            # 2. Reconstrói os containers do Laravel e Next.js com o código novo
            docker compose -f docker-compose.prod.yml up -d --build
            
            # 3. Roda as migrations do banco e limpa o cache (forçando aceitação em produção)
            docker compose exec -T backend php artisan migrate --force
            docker compose exec -T backend php artisan config:cache
            docker compose exec -T backend php artisan route:cache
            docker compose exec -T backend php artisan view:cache