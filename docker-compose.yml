name: erp-local

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: erp_local_db
      MYSQL_ROOT_PASSWORD: localroot
      MYSQL_PASSWORD: localpass
      MYSQL_USER: erp_user
    ports:
      - "3306:3306"
    volumes:
      - erp_local_db:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/app:/var/www/app
      - ./backend/bootstrap:/var/www/bootstrap
      - ./backend/routes:/var/www/routes
      - ./backend/config:/var/www/config
      - ./backend/database:/var/www/database
      - ./backend/resources:/var/www/resources
      - ./backend/tests:/var/www/tests
      - ./backend/phpunit.xml:/var/www/phpunit.xml
      - ./backend/.env:/var/www/.env
      - storage_local:/var/www/storage
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - API_BASE_URL=http://webserver:8001
    depends_on:
      - backend

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8001:8001"
    volumes:
      - ./backend/public:/var/www/public
      - ./nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  erp_local_db:
  storage_local:
  frontend_node_modules:
