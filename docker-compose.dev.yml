services:
  db_dev:
    image: mysql:8.0
    container_name: db_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: erp_db_dev
      MYSQL_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DEV_DB_PASSWORD}
      MYSQL_USER: erp_user
    volumes:
      - erp_db_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DEV_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_dev
    restart: unless-stopped
    volumes:
      - ./backend/.env.dev:/var/www/.env
      - storage_dev_data:/var/www/storage/app/public
    depends_on:
      db_dev:
        condition: service_healthy

  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api-dev.inovabi.com
    container_name: frontend_dev
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://webserver:8081
    depends_on:
      - backend_dev

  webserver:
    image: nginx:alpine
    container_name: erp-dev-webserver-1
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8081:8081"
    volumes:
      - ./backend/public:/var/www/public
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend_dev
      - frontend_dev

volumes:
  erp_db_dev_data:
  storage_dev_data:

networks:
  default:
    external: true
    name: erp_shared
