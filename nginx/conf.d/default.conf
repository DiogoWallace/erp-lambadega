# Redirecionamento de HTTP para HTTPS
server {
    listen 80;
    server_name inovabi.com api.inovabi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuração para a API (api.inovabi.com)
server {
    listen 443 ssl;
    server_name api.inovabi.com;

    root /var/www/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/inovabi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inovabi.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# Configuração para o Frontend (inovabi.com)
server {
    listen 443 ssl;
    server_name inovabi.com;

    ssl_certificate /etc/letsencrypt/live/inovabi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inovabi.com/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}