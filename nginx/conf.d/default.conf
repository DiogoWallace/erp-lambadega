# Redirecionamento HTTP → HTTPS (prod + dev)
server {
    listen 80;
    server_name inovabi.com api.inovabi.com dev.inovabi.com api-dev.inovabi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API de produção (api.inovabi.com)
server {
    listen 443 ssl;
    server_name api.inovabi.com;

    root /var/www/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/inovabi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inovabi.com/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $backend backend:9000;
        fastcgi_pass $backend;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# Frontend de produção (inovabi.com)
server {
    listen 443 ssl;
    server_name inovabi.com;

    ssl_certificate /etc/letsencrypt/live/inovabi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inovabi.com/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://frontend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_cache_bypass $http_upgrade;
    }
}

