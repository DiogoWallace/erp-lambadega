# Frontend - Next.js (porta 8080 no host → dev.inovabi.com)
server {
    listen 80;
    server_name dev.inovabi.com _;

    # Re-resolve Docker container IPs dinamicamente
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://frontend_dev:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_cache_bypass $http_upgrade;
    }
}

# API - Laravel via PHP-FPM (porta 8081 no host → dev-api.inovabi.com)
server {
    listen 8081;
    server_name dev-api.inovabi.com _;

    # Re-resolve Docker container IPs dinamicamente
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /var/www/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $backend backend_dev:9000;
        fastcgi_pass $backend;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
